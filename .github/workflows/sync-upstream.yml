name: Sync upstream

on:
  schedule:
    - cron: '17 * * * *'  # hourly, at :17 to avoid on-the-hour queue delays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream/master (3-way merge only, never rebase or force-push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/LmeSzinc/AzurLaneAutoScript
          git fetch upstream master
          git merge --no-edit upstream/master
          git push origin master
